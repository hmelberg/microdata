# The Python translator runner lives only at /py2m/. The old duplicate under
# /r2m/ was deleted (it shipped a stale copy of the whole py2m package); keep the
# URL working for any external bookmark.
[[redirects]]
  from = "/r2m/py2m_runner.html"
  to = "/py2m/py2m_runner.html"
  status = 301

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.py"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/variable_metadata.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/widgets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/command_help.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Content-Security-Policy — ENFORCED (docs/REVIEW_2026-07-07.md §3, CSP item).
# Promoted from Report-Only on 2026-10-08 after a Playwright run with this exact
# header enforced showed zero violations and output identical to a no-CSP
# baseline: boot + microdata run (incl. plot), static data source (DuckDB-WASM
# + static_data/*.parquet), python, python+#duckdb, duckdb SQL, CSV from
# raw.githubusercontent, statx, brython (pandas + plotly), jamovi, R (webR),
# AI settings dialog, hjelp/personvern (no+en), export_data.html, py2m runner.
#
# Why each source is there:
# - script-src: cdn.jsdelivr.net (pyodide, markdown-it, tabulator, brython,
#   duckdb-wasm +esm and its worker scripts), cdn.plot.ly (plotly),
#   webr.r-wasm.org (webr.mjs + its worker). 'wasm-unsafe-eval' for every
#   WASM engine (Pyodide, DuckDB, webR). 'unsafe-eval' is needed ONLY by
#   Brython (brython.min.js calls eval) — verified: dropping it breaks only
#   brython mode. blob: because the DuckDB and webR workers are blob: URLs
#   that importScripts() from the CDNs.
# - 'unsafe-inline' (script + style): index.html is one ~10k-line page with a
#   large inline <script> block, inline on*= handlers and style= attributes and
#   no build step. Hashes would have to be regenerated on every edit and do
#   not cover on*= handlers; nonces need server-side templating. Accepted
#   tradeoff — the policy still stops loading script from arbitrary origins.
# - style-src cdn.jsdelivr.net: tabulator_simple.min.css (the old Report-Only
#   policy omitted it and would have broken table styling if enforced).
# - connect-src https: (deliberately broad): Pyodide/micropip pull packages
#   from cdn.jsdelivr.net, pypi.org and files.pythonhosted.org; DuckDB from
#   extensions.duckdb.org; webR from repo.r-wasm.org; GitHub storage uses
#   api.github.com; and the load/connect/Open-from-URL directives and
#   pd.read_csv() let a user script fetch ANY https: URL by design. AI calls
#   go to the same-origin /api/* edge functions. http: stays blocked.
# - img-src https: data: blob: — plot export and markdown images.
# - object-src 'none', base-uri 'self', form-action 'self', frame-src 'self'.
#
# If a new CDN or mode is added, add its origin here and re-run the
# Playwright check (serve the repo with this header and watch the console for
# "Content Security Policy" messages) before deploying.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net https://cdn.plot.ly https://webr.r-wasm.org; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: data: blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

[[edge_functions]]
  function = "svar"
  path = "/api/svar"

[[edge_functions]]
  function = "svar-tail"
  path = "/api/svar-tail"

[[edge_functions]]
  function = "dm-vurder"
  path = "/api/dm-vurder"

[[edge_functions]]
  function = "tolk-resultat"
  path = "/api/tolk-resultat"

[[edge_functions]]
  function = "hent"
  path = "/api/hent"

